# Left half only (central). Loaded on top of corne.conf.

# Forward the right half's battery level to the computer as a second battery service.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

