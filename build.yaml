# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: corne_left
    snippet: "studio-rpc-usb-uart;zmk-usb-logging"
  # Same keymap for the Windows Canadian French layout (only the left half differs)
  - board: nice_nano_v2
    shield: corne_left
    snippet: "studio-rpc-usb-uart;zmk-usb-logging"
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DLAYOUT_CA_FR
    artifact-name: corne_left-nice_nano_v2-canadian_french
  - board: nice_nano_v2
    shield: corne_right
  - board: nice_nano
    shield: settings_reset
